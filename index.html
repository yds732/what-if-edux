<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What If</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #101418; color: #eee; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-weight: 600; text-shadow: 0 1px 3px #000; }
    #log { position: fixed; bottom: 12px; left: 12px; max-width: 440px; background: rgba(0,0,0,.65); padding: 10px 14px; border-radius: 10px; font-size: 15px; }
    #log p { margin: 4px 0 8px; }
    .choice { display: block; width: 100%; text-align: left; margin: 6px 0 0; background: #2b3540; color: #fff; }
    .choice:hover { background: #3a4756; }
    kbd { display: inline-block; min-width: 1.2em; text-align: center; background: #3ddc97; color: #04110a; border-radius: 4px; padding: 0 4px; margin-right: 6px; }
    #report { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.8); padding: 16px; }
    #report .card { background: #1c232b; padding: 24px 28px; border-radius: 14px; max-width: 600px; max-height: 85vh; overflow-y: auto; }
    .line { border-left: 4px solid #3ddc97; padding: 4px 12px; margin: 12px 0; }
    .line.bad { border-color: #f2b134; }
    .line h3 { margin: 0 0 4px; font-size: 16px; }
    .line p { margin: 4px 0; }
    .when { color: #aab; font-size: 14px; }
    .amounts { margin: 4px 0; }
    .pending { color: #889; font-style: italic; }
    .better { color: #3ddc97; }
    .disclaimer { font-size: 12px; color: #889; margin-top: 16px; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #3ddc97; color: #04110a; font-weight: 600; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <div id="hud"><div id="level"></div><div id="progress"></div></div>
  <div id="log"></div>
  <div id="report"><div class="card" id="reportBody"></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
